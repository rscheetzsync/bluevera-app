<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueVera ARMLS Debug Tester</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef4fb;color:#122033}
    .wrap{max-width:1100px;margin:40px auto;padding:0 20px}
    .card{background:#fff;border:1px solid #d9e2ec;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:22px}
    h1{margin:0 0 8px;color:#04469B;font-size:26px}
    p{margin:0 0 18px;color:#536273;line-height:1.45}
    .row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}
    input,textarea{width:100%;box-sizing:border-box;border:1px solid #bcc9d8;border-radius:8px;padding:11px 12px;font-size:14px;font-family:inherit}
    textarea{min-height:90px;resize:vertical}
    button{border:0;border-radius:8px;background:#04469B;color:#fff;padding:11px 18px;font-weight:700;cursor:pointer}
    button:hover{background:#033A82}
    .label{font-size:12px;font-weight:700;margin:12px 0 6px;color:#334155}
    .status{margin:14px 0;padding:10px 12px;border-radius:8px;background:#f3f6fa;font-size:13px;font-weight:700}
    pre{margin:0;background:#071a2f;color:#e7f1ff;padding:16px;border-radius:10px;overflow:auto;max-height:650px;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.45}
    .small{font-size:12px;color:#6b7280;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>ARMLS Raw Field Debug Tester</h1>
      <p>
        Runs from <strong>bluevera.app</strong> and calls the local
        <strong>/api/armls-debug-proxy</strong> endpoint, which securely forwards the
        authenticated request to <strong>bluevera.org/api/armls-listing</strong>.
      </p>

      <div class="label">MLS Number</div>
      <div class="row">
        <input id="mlsNumber" value="7058478" />
        <button id="runBtn" type="button">Run ARMLS Test</button>
      </div>

      <div class="label">Bearer Token</div>
      <textarea id="token" placeholder="The page will try to detect your Supabase access token automatically."></textarea>
      <div class="small">Open this page on bluevera.app while already logged in.</div>

      <div id="status" class="status">Ready.</div>
      <pre id="output">No response yet.</pre>
    </div>
  </div>

<script>
(function(){
  const mlsEl = document.getElementById("mlsNumber");
  const tokenEl = document.getElementById("token");
  const runBtn = document.getElementById("runBtn");
  const statusEl = document.getElementById("status");
  const outputEl = document.getElementById("output");

  function findSupabaseAccessToken(){
    try{
      for(let i=0;i<localStorage.length;i++){
        const key = localStorage.key(i);
        if(!key) continue;
        const raw = localStorage.getItem(key);
        if(!raw) continue;

        if(key.includes("auth-token") || key.startsWith("sb-")){
          try{
            const parsed = JSON.parse(raw);
            if(parsed && typeof parsed === "object"){
              if(parsed.access_token) return parsed.access_token;
              if(parsed.currentSession?.access_token) return parsed.currentSession.access_token;
              if(parsed.session?.access_token) return parsed.session.access_token;
            }
          }catch(e){}
        }
      }
    }catch(e){}
    return "";
  }

  const detectedToken = findSupabaseAccessToken();
  if(detectedToken){
    tokenEl.value = detectedToken;
    statusEl.textContent = "Logged-in Supabase token detected automatically.";
  }else{
    statusEl.textContent = "No token detected. Log in to bluevera.app first, then refresh this page.";
  }

  async function runTest(){
    const mlsNumber = mlsEl.value.trim();
    const token = tokenEl.value.trim() || findSupabaseAccessToken();

    if(!mlsNumber){
      statusEl.textContent = "Enter an MLS number.";
      return;
    }

    if(!token){
      statusEl.textContent = "No bearer token available.";
      return;
    }

    runBtn.disabled = true;
    statusEl.textContent = "Calling BlueVera ARMLS debug proxy…";
    outputEl.textContent = "Loading…";

    try{
      const response = await fetch("/api/armls-debug-proxy", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + token
        },
        body:JSON.stringify({ mlsNumber })
      });

      const text = await response.text();
      let data;

      try{
        data = JSON.parse(text);
      }catch(e){
        outputEl.textContent = text;
        statusEl.textContent = "Response was not valid JSON. HTTP " + response.status;
        return;
      }

      outputEl.textContent = JSON.stringify(data, null, 2);

      if(!response.ok){
        statusEl.textContent = "Request failed. HTTP " + response.status;
      }else if(data.armlsDebug){
        statusEl.textContent = "SUCCESS — raw StandardFields and CustomFields received.";
      }else{
        statusEl.textContent = "Request succeeded, but armlsDebug was not found.";
      }
    }catch(err){
      outputEl.textContent = String(err);
      statusEl.textContent = "Request error.";
    }finally{
      runBtn.disabled = false;
    }
  }

  runBtn.addEventListener("click", runTest);
})();
</script>
</body>
</html>
